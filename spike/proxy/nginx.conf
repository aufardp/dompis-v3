worker_processes 1;
events { worker_connections 64; }
http {
    access_log off;
    server {
        listen 8080;
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 10s;
            gzip off;
        }
    }
}
